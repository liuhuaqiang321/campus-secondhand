<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园二手交易平台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/extra.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">🎓 校园二手</a>
            <div class="nav-search">
                <input type="text" id="searchInput" class="search-input" placeholder="搜索你想要的宝贝...">
                <button class="btn btn-primary" onclick="searchItems()">搜索</button>
            </div>
            <div class="nav-actions">
                <span id="userInfo" class="user-info">
                    <a href="javascript:void(0)" onclick="showLoginModal()" class="btn btn-outline">登录</a>
                    <a href="javascript:void(0)" onclick="showRegisterModal()" class="btn btn-primary">注册</a>
                </span>
                <span id="userLoggedIn" class="user-info" style="display:none;">
                    <a href="javascript:void(0)" class="btn btn-outline" onclick="publishItem()">发布物品</a>
                    <a href="javascript:void(0)" class="btn btn-text" onclick="openMyCenter()">我的</a>
                    <span id="nicknameDisplay" class="nickname"></span>
                    <a href="javascript:void(0)" onclick="logout()" class="btn btn-text">退出</a>
                </span>
            </div>
        </div>
    </header>

    <!-- 分类导航 -->
    <nav class="category-nav">
        <div class="container">
            <ul id="categoryList" class="category-list">
                <li class="category-item active" data-id="0" onclick="filterByCategory(0, this)">全部</li>
            </ul>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main container">
        <div class="sort-bar">
            <span class="sort-label">排序：</span>
            <a href="javascript:void(0)" class="sort-item active" data-sort="1" onclick="changeSort(1, this)">最新发布</a>
            <a href="javascript:void(0)" class="sort-item" data-sort="2" onclick="changeSort(2, this)">价格从低到高</a>
            <a href="javascript:void(0)" class="sort-item" data-sort="3" onclick="changeSort(3, this)">价格从高到低</a>
            <a href="javascript:void(0)" class="sort-item" data-sort="4" onclick="changeSort(4, this)">最多浏览</a>
        </div>

        <div id="itemList" class="item-grid">
            <div class="loading">加载中...</div>
        </div>

        <div id="pagination" class="pagination"></div>
    </main>

    <!-- 底部说明 -->
    <footer class="site-footer">
        <div class="container">
            <p>校园二手交易平台 · 数据由云端数据库实时共享，多用户可真实完成买卖互动</p>
        </div>
    </footer>

    <!-- 物品详情弹窗 -->
    <div id="detailModal" class="modal">
        <div class="modal-content modal-lg">
            <span class="modal-close" onclick="closeModal('detailModal')">&times;</span>
            <div id="detailContent"></div>
        </div>
    </div>

    <!-- 登录弹窗 -->
    <div id="loginModal" class="modal">
        <div class="modal-content modal-sm">
            <span class="modal-close" onclick="closeModal('loginModal')">&times;</span>
            <h2>登录</h2>
            <form id="loginForm" onsubmit="login(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" class="form-input" required placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" class="form-input" required placeholder="请输入密码">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登录</button>
            </form>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div id="registerModal" class="modal">
        <div class="modal-content modal-sm">
            <span class="modal-close" onclick="closeModal('registerModal')">&times;</span>
            <h2>注册</h2>
            <form id="registerForm" onsubmit="register(event)">
                <div class="form-group">
                    <label>用户名 *</label>
                    <input type="text" id="regUsername" class="form-input" required placeholder="3-20 位字母、数字或下划线">
                </div>
                <div class="form-group">
                    <label>密码 *</label>
                    <input type="password" id="regPassword" class="form-input" required placeholder="至少 6 位">
                </div>
                <div class="form-group">
                    <label>昵称</label>
                    <input type="text" id="regNickname" class="form-input" placeholder="不填则与用户名相同">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="text" id="regPhone" class="form-input" placeholder="选填，方便买家联系">
                </div>
                <div class="form-group">
                    <label>学校</label>
                    <input type="text" id="regSchool" class="form-input" placeholder="请输入学校">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="regBtn">注册</button>
            </form>
        </div>
    </div>

    <!-- 发布物品弹窗 -->
    <div id="publishModal" class="modal">
        <div class="modal-content modal-md">
            <span class="modal-close" onclick="closeModal('publishModal')">&times;</span>
            <h2>发布物品</h2>
            <form id="publishForm" onsubmit="submitPublish(event)">
                <div class="form-group">
                    <label>物品标题 *</label>
                    <input type="text" id="pubTitle" class="form-input" required placeholder="请输入物品标题">
                </div>
                <div class="form-group">
                    <label>分类 *</label>
                    <select id="pubCategory" class="form-input" required></select>
                </div>
                <div class="form-group">
                    <label>售价 *</label>
                    <input type="number" id="pubPrice" class="form-input" required step="0.01" min="0" placeholder="请输入售价">
                </div>
                <div class="form-group">
                    <label>原价</label>
                    <input type="number" id="pubOriginalPrice" class="form-input" step="0.01" min="0" placeholder="请输入原价">
                </div>
                <div class="form-group">
                    <label>成色</label>
                    <select id="pubCondition" class="form-input">
                        <option value="1">全新</option>
                        <option value="2">几乎全新</option>
                        <option value="3">轻微使用</option>
                        <option value="4">明显使用</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>物品描述</label>
                    <textarea id="pubDescription" class="form-input" rows="4" placeholder="请描述物品的详细情况..."></textarea>
                </div>
                <div class="form-group">
                    <label>物品图片（最多 6 张，单张不超过 5MB）</label>
                    <input type="file" id="pubImages" class="form-input" accept="image/*" multiple onchange="previewImages(event)">
                    <div id="imagePreview" class="image-preview"></div>
                    <p class="form-tip">图片会自动上传到云端存储，无需手动填写图片链接</p>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="pubBtn">发布</button>
            </form>
        </div>
    </div>

    <!-- 个人中心弹窗 -->
    <div id="myCenterModal" class="modal">
        <div class="modal-content modal-lg">
            <span class="modal-close" onclick="closeModal('myCenterModal')">&times;</span>
            <div class="my-center">
                <div class="my-profile">
                    <div class="avatar-lg">👤</div>
                    <div class="my-profile-info">
                        <h3 id="myNickname">-</h3>
                        <p id="myMeta">-</p>
                    </div>
                    <div class="my-rating"><span id="myRating">暂无评分</span></div>
                </div>
                <div class="my-tabs">
                    <button class="my-tab active" data-tab="published" onclick="switchMyTab('published', this)">我发布的</button>
                    <button class="my-tab" data-tab="sold" onclick="switchMyTab('sold', this)">我卖出的</button>
                    <button class="my-tab" data-tab="bought" onclick="switchMyTab('bought', this)">我买到的</button>
                    <button class="my-tab" data-tab="favorite" onclick="switchMyTab('favorite', this)">我的收藏</button>
                    <button class="my-tab" data-tab="message" onclick="switchMyTab('message', this)">收到的留言</button>
                </div>
                <div id="myTabContent" class="my-tab-content"><div class="loading">加载中...</div></div>
            </div>
        </div>
    </div>

    <!-- 评价弹窗 -->
    <div id="reviewModal" class="modal">
        <div class="modal-content modal-sm">
            <span class="modal-close" onclick="closeModal('reviewModal')">&times;</span>
            <h2>评价订单</h2>
            <div class="form-group">
                <label>评分</label>
                <div id="starPicker" class="star-picker">
                    <span data-star="1" onclick="pickStar(1)">★</span>
                    <span data-star="2" onclick="pickStar(2)">★</span>
                    <span data-star="3" onclick="pickStar(3)">★</span>
                    <span data-star="4" onclick="pickStar(4)">★</span>
                    <span data-star="5" onclick="pickStar(5)">★</span>
                </div>
            </div>
            <div class="form-group">
                <label>评价内容</label>
                <textarea id="reviewContent" class="form-input" rows="3" placeholder="说说这次交易的感受..."></textarea>
            </div>
            <input type="hidden" id="reviewOrderId">
            <button class="btn btn-primary btn-block" onclick="submitReview()">提交评价</button>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>

    <!-- Supabase SDK 由 loadSupabaseSDK 动态加载（含 CDN 失败自动切换备用源） -->
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
